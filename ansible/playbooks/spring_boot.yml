---
- name: Deploy Spring Boot application
  hosts: app_servers
  become: true

  vars:
    app_user: rp-app
    app_dir: /opt/rp-app
    app_jar: "{{ lookup('env', 'APP_JAR_PATH') | default('target/rp-app.jar') }}"
    app_port: 8080
    spring_profile: "{{ lookup('env', 'SPRING_PROFILE') | default('prod') }}"
    db_host: "{{ lookup('env', 'DB_HOST') }}"
    db_port: "{{ lookup('env', 'DB_PORT') | default('3306') }}"
    db_name: "{{ lookup('env', 'DB_NAME') | default('rpapp') }}"
    db_username: "{{ lookup('env', 'DB_USERNAME') }}"
    db_password: "{{ lookup('env', 'DB_PASSWORD') }}"

  tasks:
    - name: Ensure Java 21 is installed
      ansible.builtin.dnf:
        name: java-21-openjdk-headless
        state: present

    - name: Ensure application directory exists
      ansible.builtin.file:
        path: "{{ app_dir }}"
        state: directory
        owner: "{{ app_user }}"
        group: "{{ app_user }}"
        mode: "0750"

    - name: Upload application JAR
      ansible.builtin.copy:
        src: "{{ app_jar }}"
        dest: "{{ app_dir }}/rp-app.jar"
        owner: "{{ app_user }}"
        group: "{{ app_user }}"
        mode: "0640"
      notify: Restart rp-app

    - name: Deploy application environment file
      ansible.builtin.template:
        src: ../templates/rp-app.env.j2
        dest: "{{ app_dir }}/.env"
        owner: "{{ app_user }}"
        group: "{{ app_user }}"
        mode: "0600"
      notify: Restart rp-app

    - name: Deploy systemd service unit
      ansible.builtin.template:
        src: ../templates/rp-app.service.j2
        dest: /etc/systemd/system/rp-app.service
        owner: root
        group: root
        mode: "0644"
      notify:
        - Reload systemd
        - Restart rp-app

    - name: Ensure rp-app service is enabled and running
      ansible.builtin.systemd:
        name: rp-app
        state: started
        enabled: true
        daemon_reload: true

  handlers:
    - name: Reload systemd
      ansible.builtin.systemd:
        daemon_reload: true

    - name: Restart rp-app
      ansible.builtin.systemd:
        name: rp-app
        state: restarted
